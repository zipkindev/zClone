name: Feature request
description: Suggest an improvement to Zclone
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before proposing a solution. Do not include account
        credentials or other private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow that is currently difficult or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: Explain the expected command-line, configuration, or API behaviour.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any existing workaround.
    validations:
      required: false
