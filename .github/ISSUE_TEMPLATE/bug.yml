name: Bug report
description: Report a reproducible problem with Zclone
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report reproducible defects only. Never include passwords, tokens, keys,
        or private paths in an issue.
  - type: textarea
    id: version
    attributes:
      label: Zclone version
      description: Paste the output of `zclone version`.
      render: text
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and reproduction steps
      description: Include the storage backend and the smallest safe command that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted configuration
      description: Paste `zclone config redacted` only after confirming secrets are removed.
      render: ini
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Redacted debug log
      description: Attach output from `zclone -vv --log-file zclone.log ...` with secrets removed.
      render: text
    validations:
      required: false
