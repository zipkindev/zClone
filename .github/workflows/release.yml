name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOPROXY: "off"
  GOSUMDB: "off"
  GOFLAGS: "-mod=vendor"
  GOTOOLCHAIN: "local"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate downstream release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python3 bin/version.py check --tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: false
      - name: Build release archive with vendored dependencies
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build/recovery-verification/tmp
          export GOTMPDIR="$PWD/build/recovery-verification/tmp"
          go run bin/make_sbom.go
          python3 bin/package-release.py "$RELEASE_TAG" "$TARGET_OS" "$TARGET_ARCH"
          if [[ "$TARGET_OS" == windows && "$TARGET_ARCH" == amd64 ]]; then
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags '-s -w -H windowsgui' -o build/releases/zClone-Updater.exe ./bin/windows-installer
            (cd build/releases && sha256sum zClone-Updater.exe > zClone-Updater.exe.sha256)
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: build/releases/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: build/releases
      - name: Check archives and publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd build/releases
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 6
          test "$(head -n 1 ../../RELEASE-NOTES.md)" = "# zClone $RELEASE_TAG"
          cp ../../RELEASE-NOTES.md notes.md
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Release is already published; refusing to replace assets"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease=false --title "zClone $RELEASE_TAG" --notes-file notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.zip zClone-Updater.exe SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
