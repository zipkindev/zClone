zclone-webdav-server:
  container_name: zclone-webdav-server

  image: zclone/zclone
  command:
# Tweak here zclone's command line switches:
#    - "--config"
#    - "/path/to/mounted/zclone.conf"
    - "--verbose"
    - "serve"
    - "webdav"
    - "remote:/"
#    - "--addr"
#    - "0.0.0.0:8080"
    - "--read-only"
#    - "--no-modtime"
#    - "--no-checksum"

  restart: unless-stopped

  # Use host networking for simplicity.
  # It also enables server's default listen on 127.0.0.1 to work safely.
  net: host

  # If you want to use port mapping instead of host networking,
  # make sure to make zclone listen on 0.0.0.0.
  #ports:
  #  - "127.0.0.1:8080:8080"

  # Here you have to map your host's zclone.conf directory to
  # container's /root/.config/zclone/ dir (R/O).
  # If you have any remote referencing local files, you have to
  # map them here, too.
  volumes:
    - ~/.config/zclone/:/root/.config/zclone/:ro
