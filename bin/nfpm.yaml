name: "zclone"
arch: "{{.Arch}}"
platform: "linux"
version: "{{.Version}}"
section: "default"
priority: "extra"
provides:
- zclone
maintainer: "Zclone Maintainers"
description: |
  Zclone - "rsync for cloud storage"
    is a command-line program to sync files and directories to and
    from most cloud providers. It can also mount, tree, ncdu and lots
    of other useful things.
vendor: "zclone"
license: "MIT"
contents:
  - src: ./zclone
    dst: /usr/bin/zclone
  - src: ./README.html
    dst: /usr/share/doc/zclone/README.html
  - src: ./README.txt
    dst: /usr/share/doc/zclone/README.txt
  - src: ./zclone.1
    dst: /usr/share/man/man1/zclone.1
